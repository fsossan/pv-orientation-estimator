[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-orientation-estimator"
version = "0.1.0"
description = "Estimate PV array tilt and azimuth from measured AC power via clearsky reference profiles and non-negative least squares."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pv", "solar", "tilt", "azimuth", "orientation", "pvlib", "nnls", "estimation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pvlib>=0.10",
    "cvxpy>=1.4",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
